<div class="app">

  <!-- PAGE BODY -->
  <div class="page-body">
    <h2 class="directory-title">Feature directory</h2>

    <div class="stats-row">
      <nx-card class="stat-card stat-card--validated">
        <nx-data-display label="Validated" size="large" class="stat-value">{{ validatedCount() }}</nx-data-display>
      </nx-card>
      <nx-card class="stat-card stat-card--pending">
        <nx-data-display label="Pending approval" size="large" class="stat-value">{{ pendingApprovalCount() }}</nx-data-display>
      </nx-card>
      <nx-card class="stat-card stat-card--in-progress">
        <nx-data-display label="In progress" size="large" class="stat-value">{{ inProgressCount() }}</nx-data-display>
      </nx-card>
      <nx-card class="stat-card stat-card--total">
        <nx-data-display label="Demos created" size="large" class="stat-value">{{ totalCount() }}</nx-data-display>
      </nx-card>
    </div>

    <div class="directory-table-container">
      <ag-grid-angular
        class="ag-theme-alpine ag-theme-aquila ag-theme-allianz-icons"
        style="width: 100%; height: 320px;"
        [rowData]="demos()"
        [columnDefs]="columnDefs"
        [domLayout]="'normal'"
        [getRowId]="getRowId">
      </ag-grid-angular>
    </div>
  </div>
</div>
